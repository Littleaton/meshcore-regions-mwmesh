server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # The map's production base URL is /meshcore/map/. Make that mount path
    # work without keeping a second copy of the static site in the image.
    location = /meshcore {
        return 301 /meshcore/;
    }

    location /meshcore/ {
        rewrite ^/meshcore/(.*)$ /$1 last;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

